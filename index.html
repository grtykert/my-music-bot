<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Настройки поиска</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0d1117);
            --card-bg: var(--tg-theme-secondary-bg-color, #161b22);
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --text-main: var(--tg-theme-text-color, #f0f6fc);
            --text-sub: var(--tg-theme-hint-color, #8b949e);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 28px;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            line-height: 1.4;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .badge {
            background: var(--accent-gradient);
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .slider-wrapper {
            position: relative;
            padding: 8px 0;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        .scale-bar {
            display: flex;
            gap: 5px;
            margin-top: 18px;
        }

        .scale-segment {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.08);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .scale-segment.active {
            background: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--accent-gradient);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
            transition: all 0.15s ease;
            margin-top: auto;
        }

        .save-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div>
        <div class="header">
            <div class="icon-box">⚡</div>
            <h1>Выдача треков</h1>
            <p>Укажи количество треков на одной странице поиска</p>
        </div>

        <div class="card">
            <div class="card-top">
                <span class="card-title">Размер страницы</span>
                <span class="badge" id="trackCount">10 треков</span>
            </div>

            <div class="slider-wrapper">
                <input type="range" id="tracksRange" min="1" max="10" value="10" step="1">
            </div>

            <div class="scale-bar" id="scaleBar"></div>
        </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">Сохранить настройки</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const rangeInput = document.getElementById('tracksRange');
        const countDisplay = document.getElementById('trackCount');
        const scaleBar = document.getElementById('scaleBar');
        const maxVal = 10;

        function renderScale(val) {
            scaleBar.innerHTML = '';
            for (let i = 1; i <= maxVal; i++) {
                const seg = document.createElement('div');
                seg.className = 'scale-segment' + (i <= val ? ' active' : '');
                scaleBar.appendChild(seg);
            }
        }

        function updateUI(val) {
            countDisplay.textContent = val + ' ' + getTrackWord(val);
            renderScale(val);
        }

        function getTrackWord(n) {
            if (n === 1) return 'трек';
            if (n >= 2 && n <= 4) return 'трека';
            return 'треков';
        }

        rangeInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            updateUI(val);
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        });

        updateUI(rangeInput.value);

        function saveSettings() {
            const val = parseInt(rangeInput.value);
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            
            tg.sendData(JSON.stringify({
                action: 'set_tracks_per_page',
                count: val
            }));

            tg.close();
        }
    </script>
</body>
</html>
